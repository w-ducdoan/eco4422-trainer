  add({ id: 'l08', date: 'Oct 1', title: 'Cycles and covariance stationarity', skills: ['stat'],
    take: 'Stationary = the series behaves the same in every slice of time: steady average, steady wiggle, and links to its past that depend only on how far back you look. Cycles are allowed.',
    body: `
<h3>The definition, piece by piece</h3>
<p>A series is <dfn>covariance stationary</dfn> when:</p>
<ol><li><b>Constant mean</b>: E(y<sub>t</sub>) = μ for every t. No drift up or down.</li>
<li><b>Constant variance</b>: the wiggle is the same size in 1990 and 2020.</li>
<li><b>Autocovariance depends only on the lag τ</b>: the link between y<sub>t</sub> and y<sub>t−τ</sub> (γ(τ) = Cov(y<sub>t</sub>, y<sub>t−τ</sub>)) is the same whatever the date.</li></ol>
<p>The <dfn>autocorrelation</dfn> ρ(τ) = γ(τ)/γ(0) is that link scaled to −1…1. γ(0) is just the variance.</p>
{{fig:stationary}}
<table class="mini"><tr><th>Level</th><th>Trend or season?</th><th>Cycle?</th><th>Examples</th><th>Next step</th></tr>
<tr><td>Non-stationary</td><td>Yes</td><td>Maybe</td><td>EMP, FARMEMP, GDP</td><td>Detrend, deseasonalize or difference</td></tr>
<tr><td>Stationary</td><td>No</td><td>Maybe</td><td>AR1A, MA1A, residuals</td><td>Model the cycle with AR/MA</td></tr>
<tr><td>White noise</td><td>No</td><td>No</td><td>WN</td><td>Done: nothing left to predict</td></tr></table>
<p><b>Every white noise series is stationary; not every stationary series is white noise.</b></p>
<h3>Why it matters</h3>
<p>ACF/PACF and AR/MA models need stable relationships. A trending series looks "connected to its past" just because it drifts: EMP's autocorrelations stay near 1 for 25 lags.</p>`,
    check: [
      { q: 'A series cycles above and below a steady average. Stationary?', options: ['Yes: cycles are allowed', 'No: any pattern breaks stationarity', 'Only if it is white noise'], answer: 0, explain: 'Steady mean and variance → stationary, cycle and all.' },
      { q: 'A series rises steadily over 30 years. Stationary?', options: ['No: the mean drifts', 'Yes, if the rise is straight', 'Yes'], answer: 0, explain: 'A trend means the average changes over time.' },
      { q: 'ρ(τ) equals…', options: ['γ(τ) / γ(0)', 'γ(0) / γ(τ)', 'γ(τ) × T'], answer: 0, explain: 'Autocovariance at lag τ divided by the variance.' }
    ] });

  add({ id: 'l09', date: 'Oct 6', title: 'Making data stationary', skills: ['stat'],
    take: 'Two fixes: regress the trend or season out and keep the residuals, or difference the data (first difference for a trend, seasonal difference for a season).',
    body: `
<h3>Method 1: regress it out, use the residuals</h3>
<ul><li>Trend: regress on TIME (and TIME² if it bends) = <dfn>detrending</dfn>.</li>
<li>Season: regress on month dummies = <dfn>deseasonalizing</dfn>.</li>
<li>Both: one regression with both. Kamp's farm jobs: dummies + TIME → the residuals DTSRESIDS.</li></ul>
<p>The residuals are what's left after removing the predictable part: that's the stationary series you model.</p>
<h3>Method 2: difference</h3>
<ul><li>Trend: <dfn>first difference</dfn> y<sub>t</sub> − y<sub>t−1</sub> = (1 − L)y<sub>t</sub>. A steady climb becomes a steady change.</li>
<li>Season: <dfn>seasonal difference</dfn> y<sub>t</sub> − y<sub>t−12</sub> = (1 − L<sup>12</sup>)y<sub>t</sub>.</li>
<li>Both: one of each. DDFARMEMP (both differences) came closest to white noise.</li></ul>
<p>Bonus: <b>logs</b> steady a variance that grows over time.</p>
<h3>On the exam (old Q7)</h3>
<p>"Give two methods to work with non-stationary series": (1) regress out trend/season and use the residuals; (2) difference (first and/or seasonal). Mention logs for a growing variance.</p>`,
    check: [
      { q: 'Which removes a monthly seasonal pattern?', options: ['y(t) − y(t−12)', 'y(t) − y(t−1) only', 'Taking logs only'], answer: 0, explain: 'The seasonal difference compares the same months.' },
      { q: 'After regressing y on TIME, which series do you model as stationary?', options: ['The residuals', 'The fitted values', 'TIME'], answer: 0, explain: 'Residuals = y with the trend removed.' },
      { q: 'What do logs help with?', options: ['A variance that grows over time', 'Seasonality', 'Serial correlation'], answer: 0, explain: 'Logs shrink big values more than small ones.' }
    ] });

  add({ id: 'l10', date: 'Oct 8', title: 'White noise, the lag operator and Wold', skills: ['lag', 'wn'],
    take: 'White noise is pure unpredictable shock. L is the "go back one period" button. Wold says any stationary series is a weighted sum of past shocks, which ARMA models approximate.',
    body: `
<h3>White noise</h3>
<p>ε<sub>t</sub> ~ WN(0, σ²): mean 0, constant variance σ², and <b>no correlation with any of its own past values</b>. Knowing the past tells you nothing about the next value. Independent white noise: the values are fully independent; Gaussian white noise: also normally distributed.</p>
<p><dfn>Unconditional</dfn> mean/variance = the long-run average and spread. <dfn>Conditional</dfn> = given what you know so far (the information set Ω<sub>t−1</sub>). For white noise both means are 0, because the past doesn't help.</p>
<h3>The lag operator</h3>
{{fig:lag}}
<p>L·y<sub>t</sub> = y<sub>t−1</sub>, L²·y<sub>t</sub> = y<sub>t−2</sub>, L<sup>k</sup>·y<sub>t</sub> = y<sub>t−k</sub>. The power on L = how many periods back. First difference (1 − L)y<sub>t</sub>; seasonal difference (1 − L<sup>12</sup>)y<sub>t</sub>.</p>
<p><b>Pack</b> (normal → lag form): rewrite every past term as an L-power times the present term, then pull the present term out. y<sub>t</sub> − 0.4y<sub>t−1</sub> = ε<sub>t</sub> + 0.3ε<sub>t−1</sub> − 0.05ε<sub>t−2</sub> → (1 − 0.4L)y<sub>t</sub> = (1 + 0.3L − 0.05L²)ε<sub>t</sub>.</p>
<p><b>Unpack</b> (lag form → normal): multiply out. (1 − 0.2L + 0.03L²)y<sub>t</sub> = (1 + 0.6L − 0.03L³)ε<sub>t</sub> → y<sub>t</sub> − 0.2y<sub>t−1</sub> + 0.03y<sub>t−2</sub> = ε<sub>t</sub> + 0.6ε<sub>t−1</sub> − 0.03ε<sub>t−3</sub>. <b>No L² on the right → no ε<sub>t−2</sub>.</b></p>
<p>If a past y sits on the RIGHT (y<sub>t</sub> = 0.4y<sub>t−1</sub> + ε<sub>t</sub>), move it left first: its sign flips → (1 − 0.4L)y<sub>t</sub> = ε<sub>t</sub>.</p>
<h3>ARMA(p, q)</h3>
<p>Past y's = the <dfn>AR</dfn> (autoregressive) part; the highest L-power on the y side = <b>p</b>. Past shocks = the <dfn>MA</dfn> (moving average) part; highest power on the ε side = <b>q</b>. Old exam Q5a is ARMA(1,2); Q5b is ARMA(2,3).</p>
<h3>Wold's theorem</h3>
<p>Any covariance-stationary series (minus anything perfectly predictable) can be written as <span class="eq">y<sub>t</sub> = Σ b<sub>i</sub>ε<sub>t−i</sub></span>, b<sub>0</sub> = 1, Σb<sub>i</sub>² finite: a weighted sum of today's and all past shocks. Infinitely many weights can't be estimated, so we approximate with a few: that's what ARMA(p,q) does.</p>`,
    check: [
      { q: 'L³·ε(t) = ?', options: ['ε(t−3)', 'ε(t+3)', '3ε(t)'], answer: 0, explain: 'Power = periods back.' },
      { q: '(1 − 0.5L)y(t) = (1 + 0.2L²)ε(t) in normal form:', options: ['y(t) − 0.5y(t−1) = ε(t) + 0.2ε(t−2)', 'y(t) − 0.5y(t−1) = ε(t) + 0.2ε(t−1)', 'y(t) + 0.5y(t−1) = ε(t) + 0.2ε(t−2)'], answer: 0, explain: 'Keep exactly the powers you see; L² → two periods back.' },
      { q: 'That model is ARMA(?, ?)', options: ['ARMA(1, 2)', 'ARMA(2, 1)', 'ARMA(1, 1)'], answer: 0, explain: 'Highest power on y: 1; on ε: 2.' }
    ] });

  add({ id: 'l11', date: 'Oct 13', title: 'Q-tests and MA processes', skills: ['wn', 'arma', 'acf'],
    take: 'The Ljung-Box Q test checks many autocorrelations at once (H₀: white noise). An MA(q) remembers the last q shocks, so its ACF cuts off after lag q.',
    body: `
<h3>Sample autocorrelations and their bands</h3>
<p>ρ̂(τ) = Σ(y<sub>t</sub> − ȳ)(y<sub>t−τ</sub> − ȳ) / Σ(y<sub>t</sub> − ȳ)². If the series is white noise, each ρ̂(τ) ≈ N(0, 1/T), so 95% of them land within <b>±2/√T</b>. With T = 312: ±0.113. A bar outside the band = significant.</p>
<h3>Box-Pierce and Ljung-Box</h3>
<p>Instead of eyeballing bars one at a time, square the first m autocorrelations and add them up:</p>
<p><span class="eq">Q<sub>BP</sub> = T Σ<sub>τ=1..m</sub> ρ̂(τ)²</span> ~ χ²<sub>m</sub> (works with big samples) and <span class="eq">Q<sub>LB</sub> = T(T+2) Σ ρ̂(τ)²/(T−τ)</span> (adjusted for smaller samples). <b>H₀: white noise.</b> Signif below 0.05 → reject. Kamp's rule: m = √T (T = 312 → 18).</p>
<pre class="rats">Ljung-Box Q-Statistics           (WN)
     Lags  Statistic Signif Lvl
       18     25.116   0.121753   → fail to reject: white noise

Ljung-Box Q-Statistics           (MA1A)
       18     88.049   0.000000   → reject: not white noise</pre>
<h3>MA(q): a memory of the last q shocks</h3>
<p><span class="eq">MA(1): y<sub>t</sub> = ε<sub>t</sub> + θε<sub>t−1</sub></span>. Unconditional mean 0; variance (1 + θ²)σ². Conditional mean (knowing last month's shock) θε<sub>t−1</sub>; conditional variance σ².</p>
<p>Autocorrelation: <span class="eq">ρ(1) = θ/(1 + θ²)</span>, ρ(τ) = 0 for τ &gt; 1. With θ = 0.8: 0.8/1.64 = 0.49. ρ(1) can never exceed 0.5. y<sub>t</sub> and y<sub>t−2</sub> share no shocks, so the ACF <b>cuts off</b> after lag 1. The PACF instead dies off gradually, alternating sign when θ &gt; 0.</p>
<div class="imgpair">{{img:k_ma1a|Kamp's MA1A (θ = 0.8): one ACF bar, then nothing}}{{img:k_ma2|Kamp's MA2: two ACF bars, then nothing}}</div>
<p>All MA(q) processes are covariance stationary. |θ| &lt; 1 makes an MA(1) <dfn>invertible</dfn> (it can be rewritten in terms of past y's).</p>`,
    check: [
      { q: 'Ljung-Box Signif = 0.003. Conclusion?', options: ['Not white noise', 'White noise', 'Normal'], answer: 0, explain: 'H₀ is white noise; 0.003 < 0.05 rejects it.' },
      { q: 'MA(1) with θ = 0.5: ρ(1) = ?', options: ['0.4', '0.5', '0.25'], answer: 0, explain: '0.5 / (1 + 0.25) = 0.4.' },
      { q: 'With T = 400, the white-noise bands are about…', options: ['±0.10', '±0.05', '±0.20'], answer: 0, explain: '2/√400 = 2/20 = 0.10.' }
    ] });

  add({ id: 'l12', date: 'Oct 15', title: 'AR processes', skills: ['arma', 'acf'],
    take: 'An AR(p) regresses today on its own last p values. Its ACF fades gradually (φ, φ², φ³…), while its PACF cuts off after p lags. Exam 1 material ends here.',
    body: `
<h3>AR(1)</h3>
<p><span class="eq">y<sub>t</sub> = φy<sub>t−1</sub> + ε<sub>t</sub></span>, or (1 − φL)y<sub>t</sub> = ε<sub>t</sub>. Today = a fraction φ of yesterday + a new shock.</p>
<ul><li><b>Stationary only if |φ| &lt; 1.</b> Then shocks fade: y<sub>t</sub> = ε<sub>t</sub> + φε<sub>t−1</sub> + φ²ε<sub>t−2</sub> + … (an infinite MA, Wold in action).</li>
<li>Unconditional mean 0; variance <span class="eq">σ²/(1 − φ²)</span>. φ = 0.8, σ² = 1 → 2.78.</li>
<li>Conditional mean φy<sub>t−1</sub>; conditional variance σ².</li>
<li>Autocorrelation <span class="eq">ρ(τ) = φ<sup>τ</sup></span>: 0.8, 0.64, 0.51, 0.41… fades gradually. If φ &lt; 0 it flips sign every lag.</li></ul>
<h3>Partial autocorrelations (PACF)</h3>
<p>The <dfn>partial autocorrelation</dfn> at lag τ = the coefficient on y<sub>t−τ</sub> in a regression of y<sub>t</sub> on y<sub>t−1</sub>, …, y<sub>t−τ</sub>: the link to τ months back <i>after</i> accounting for the months in between. For an AR(1), once you know y<sub>t−1</sub>, y<sub>t−2</sub> adds nothing → PACF = φ at lag 1, then 0. <b>AR(p): PACF nonzero for the first p lags, then 0.</b></p>
<div class="imgpair">{{img:k_ar1a|Kamp's AR1A (φ = 0.8): ACF fades, one PACF bar}}{{img:k_ar2|Kamp's AR2: ACF fades, two PACF bars (≈ 0.84, 0.46)}}</div>
<h3>AR(2) and AR(p)</h3>
<p>y<sub>t</sub> = φ<sub>1</sub>y<sub>t−1</sub> + φ<sub>2</sub>y<sub>t−2</sub> + ε<sub>t</sub>, i.e. (1 − φ<sub>1</sub>L − φ<sub>2</sub>L²)y<sub>t</sub> = ε<sub>t</sub>. In general Φ(L)y<sub>t</sub> = ε<sub>t</sub>. Autocorrelations fade toward zero (if stationary); partials are nonzero for the first p lags, then zero.</p>`,
    check: [
      { q: 'AR(1) with φ = 0.6: ρ(2) = ?', options: ['0.36', '0.6', '1.2'], answer: 0, explain: 'φ² = 0.36.' },
      { q: 'Is y(t) = 1.1y(t−1) + ε(t) stationary?', options: ['No: |φ| ≥ 1', 'Yes', 'Only if σ² is small'], answer: 0, explain: 'Stationary only if |φ| < 1; 1.1 explodes.' },
      { q: 'PACF has 3 significant bars then nothing; ACF fades. Model?', options: ['AR(3)', 'MA(3)', 'White noise'], answer: 0, explain: 'AR cuts off in the PACF.' }
    ] });

  add({ id: 'l13', date: 'Must-know', title: 'Reading ACF/PACF graphs (Kamp\'s handwritten note)', skills: ['acf', 'wn', 'norm'],
    take: 'Ask four questions in order: stationary? white noise? which one cuts off, ACF or PACF? after how many bars? MA cuts off in the ACF; AR cuts off in the PACF.',
    body: `
<p>Kamp's guidance for Exam 1: <i>be able to use ACF/PACF graphs to determine whether a series is stationary, whether it's white noise, and whether it's AR(p) or MA(q), with p and q. Also know the tests for normality and white noise.</i></p>
<h3>Reading the RATS @bjident graph</h3>
<p>Each lag has two bars: <b>dark = autocorrelations (CORRS)</b>, <b>light = partial autocorrelations (PARTIALS)</b>. Lag 0 is always 1 (a series is perfectly correlated with itself), so ignore it. The two lines are the significance bands (about ±2/√T near the start; RATS widens the ACF band at higher lags). A bar past a line = significant.</p>
<h3>The four questions</h3>
<table class="mini"><tr><th>What you see</th><th>Verdict</th></tr>
<tr><td>ACF starts near 1 and dies off very slowly</td><td><b>Non-stationary: trend</b> (EMP, LEMP)</td></tr>

  function qHTML(id, opts = {}) {

      <header class="qhead"><div><div class="qref">${q.num ? `Question ${q.num} · ` : ''}${esc(q.examRef || '')}</div><h3>${esc(q.title)}</h3></div></header>

  function rerenderPart(id, pi) { const el = document.getElementById(`p-${id}-${pi}`); if (el) el.outerHTML = partHTML(id, pi); }
  function gradeQ(id, mode) {
    const st = QS.get(id); st.graded = true;
    const textIdx = [];
    st.q.parts.forEach((p, pi) => {
      if (p.kind === 'mc') st.res[pi] = { sc: st.ans[pi] === p.answer ? 1 : 0 };
      else if (p.kind === 'num') { const v = parseNum(st.ans[pi]); const allow = Math.max(p.tol.abs || 0, (p.tol.rel || 0) * Math.abs(p.answer)) + 1e-9; st.res[pi] = { sc: isFinite(v) && Math.abs(v - p.answer) <= allow ? 1 : 0 }; }
      else { st.res[pi] = { sc: 0, status: 'self', covered: [] }; textIdx.push(pi); }
      if (p.kind !== 'text') record(p.skill, st.q.gen, st.res[pi].sc, mode, id + pi);
    });
    return textIdx;
  }
  async function claudeGrade(items) { // items: [{id, pi}]
    if (!S.sample || !items.length) return false;
    items.forEach(({ id, pi }) => { QS.get(id).res[pi] = { sc: 0, status: 'grading', covered: [] }; rerenderPart(id, pi); });
    const payload = items.map(({ id, pi }) => { const p = QS.get(id).q.parts[pi]; return { question: plain(p.q), model_answer: p.model, key_points: p.points, student_answer: QS.get(id).ans[pi] || '' }; });
    const prompt = `You are grading short written answers on an undergraduate time-series econometrics exam (ECO 4422: regression, RATS output, trends, seasonality, stationarity, ARMA). For each item compare the student's answer with the model answer and the numbered key points (index from 0). A key point counts as covered if the student states the idea correctly in any wording. Penalize wrong statements (for example "higher AIC is better"). A blank answer scores 0.
Return JSON only, no prose: {"results":[{"score": number from 0 to 1, "covered": [indices of key points covered], "feedback": "2-3 short plain-English sentences to the student (use 'you'): what was right, what is missing or wrong, and one concrete fix"}]} with one result per item, in order.
Items:
${JSON.stringify(payload, null, 1)}`;
    try {
      const out = await S.sample.json(prompt, { modelTier: 'default' });
      const res = (out && out.results) || [];
      items.forEach(({ id, pi }, i) => { const r = res[i] || {}; const st = QS.get(id); st.res[pi] = { sc: Math.max(0, Math.min(1, +r.score || 0)), covered: Array.isArray(r.covered) ? r.covered.map(Number) : [], feedback: String(r.feedback || ''), status: 'claude' }; record(st.q.parts[pi].skill, st.q.gen, st.res[pi].sc, st.mode, id + pi); rerenderPart(id, pi); });
      save(); return true;
    } catch (e) {
      const why = e && e.code === 'not_granted' ? 'not allowed in this view' : e && e.code === 'rate_limited' ? 'too many requests, try again in a minute' : '';
      if (e && e.code === 'not_granted') S.sample = null;
      items.forEach(({ id, pi }) => { QS.get(id).res[pi] = { sc: 0, status: 'err', covered: [], why }; rerenderPart(id, pi); });
      return false;
    }
  }
  function selfGrade(id, pi) {
    const st = QS.get(id), p = st.q.parts[pi], boxes = [...document.querySelectorAll(`[data-self][data-q="${id}"][data-p="${pi}"]`)];
    const cov = boxes.filter(b => b.checked).map(b => +b.dataset.k), r = st.res[pi];
    r.covered = cov; r.sc = cov.length / p.points.length;
    // keep only the latest self-grade for this part
    S.prog.attempts = S.prog.attempts.filter(a => a.k !== SID + id + pi);
    record(p.skill, st.q.gen, r.sc, st.mode + '-self', id + pi); save();
  }

${parts}
${extra ? '\nStudent\'s question: ' + extra : ''}`;

  function answeredCount() { let n = 0; S.mock.ids.forEach(id => { const st = QS.get(id); st.q.parts.forEach((p, pi) => { const a = st.ans[pi]; if (a !== undefined && a !== '' && a !== null) n++; }); }); return n; }
  function buildMock() {

      ${weak.length ? `<p><b>Work on:</b> ${weak.join(', ')}. Each question below shows the right answers and why.</p>` : ''}</div></div></section>`;
  }
  function finalizeMockQuiet() { let a = 0, b = 0; const per = {}; S.mock.ids.forEach((id, i) => { const st = QS.get(id); let qa = 0, qb = 0; st.q.parts.forEach((p, pi) => { const w = p.pts || 1; qb += w; qa += w * ((st.res[pi] && st.res[pi].sc) || 0); }); per[i + 1] = qb ? qa / qb : 0; a += qa; b += qb; }); S.mock.score = b ? a / b : 0; S.mock.per = per; }

  // ----- old exam -----
  function oldView() {
    if (!S.old) { S.old = { ids: C.oldExam().map(q => makeQ(q, 'old')) }; }
    return `<section><h1>Kamp's old Exam 1</h1><p class="muted">The real questions with Kamp's real printouts and graphs. Check each question on its own; written parts are graded by Claude${S.sample ? '' : ' or by you against the key points'}. The last set is the actual ACF/PACF graphs from the 10/13 and 10/15 lectures, for the handwritten note.</p></section>
    ${S.old.ids.map(id => { const st = QS.get(id); return qHTML(id, { footer: st.graded ? `<div class="qfoot"><b>${pct(qScore(id))}</b> on this question. <button class="btn ghost" data-act="oldreset" data-q="${id}">Try again</button></div>${askBox(id)}` : `<div class="qfoot"><button class="btn" data-act="check" data-q="${id}">Check this question</button></div>` }); }).join('')}`;
  }

  // ---------- events ----------
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = b.dataset.q;
    if (act === 'nav') { if (b.dataset.v === 'lessons') S.lesson = null; if (b.dataset.v === 'drills') S.drill = null; go(b.dataset.v); }
    else if (act === 'lessons') go('lessons', { lesson: null });
    else if (act === 'lesson') go('lessons', { lesson: b.dataset.l });
    else if (act === 'drills') go('drills', { drill: null });
    else if (act === 'drill') go('drills', { drill: { id: b.dataset.d, qid: null, n: 0, sum: 0 } });
    else if (act === 'next') { newDrillQ(); render(); window.scrollTo({ top: 0 }); }
    else if (act === 'mc') { const st = QS.get(id); if (st.graded) return; st.ans[+b.dataset.p] = +b.dataset.i; rerenderPart(id, +b.dataset.p); if (st.mode === 'mock') persistMock(); }
    else if (act === 'check') {
      const st = QS.get(id), textIdx = gradeQ(id, st.mode);
      if (st.mode === 'lesson') { const l = C.LESSONS.find(x => x.id === S.lessonQ.lid); const sc = qScore(id); const prev = S.prog.lessons[l.id]; if (!prev || sc >= (prev.sc || 0)) S.prog.lessons[l.id] = { t: Date.now(), sc }; }
      if (st.mode === 'drill') { S.drill.n++; }
      save(); render();
      if (textIdx.length && S.sample) { await claudeGrade(textIdx.map(pi => ({ id, pi }))); }
      if (st.mode === 'drill') { S.drill.sum += qScore(id); }
      if (st.mode === 'old') { S.prog.olds.push({ t: Date.now(), sc: qScore(id), q: st.q.num }); save(); }
      render();
    }
    else if (act === 'ask') ask(id);
    else if (act === 'oldreset') { const st = QS.get(id); st.graded = false; st.res = {}; render(); }
    else if (act === 'mockstart') { S.mock = { seed: newSeed(), start: Date.now(), done: false, ans: {} }; buildMock(); persistMock(); render(); window.scrollTo({ top: 0 }); }
    else if (act === 'mocksubmit') { const n = answeredCount(), tot = S.mock.ids.reduce((s, i) => s + QS.get(i).q.parts.length, 0); if (n < tot && !b.dataset.sure) { b.dataset.sure = '1'; b.textContent = `${tot - n} parts blank. Submit anyway?`; return; } submitMock(); }
    else if (act === 'mocknew') { lsDel(LS_MOCK); S.mock = null; render(); window.scrollTo({ top: 0 }); }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.matches('[data-num],[data-text]')) { const st = QS.get(t.dataset.q); if (st && !st.graded) { st.ans[+t.dataset.p] = t.value; if (st.mode === 'mock') { clearTimeout(t._pt); t._pt = setTimeout(persistMock, 400); } } }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('[data-self]')) { selfGrade(t.dataset.q, +t.dataset.p); if (S.view === 'mock' && S.mock && S.mock.done) { finalizeMock(); const r = document.querySelector('.results'); if (r) r.outerHTML = mockResults(); } }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.askin')) { const id = e.target.id.replace('askq-', ''); ask(id); } });

  setInterval(() => {
    const cd = $('#cd'); if (cd) cd.textContent = countdown();
    const tm = $('#timer'); if (tm && S.mock && !S.mock.done) { const left = S.mock.start + MOCK_MIN * 60000 - Date.now(); tm.textContent = fmtLeft(left); tm.classList.toggle('low', left < 600000); }
  }, 1000);

  const v = lsGet(LS_VIEW); if (v && NAV.some(n => n[0] === v)) S.view = v;
  render();
  connect();
})();

</script>
</body>
</html>
